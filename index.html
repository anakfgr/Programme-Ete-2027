<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Programme Été 2027</title>
<meta name="theme-color" content="#2B54F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Été 2027">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen phone app. Scrolling view + fixed bottom tab bar; workout mode and exercise sheets are full overlays. */
:root{
  --bg:#F1F3F7; --surface:#FFFFFF; --surface-2:#E7EBF2; --ink:#0E1522; --ink-2:#465166; --ink-3:#7E8899;
  --line:#DBE0E8; --accent:#2B54F5; --accent-ink:#FFFFFF; --accent-soft:#DDE4FF;
  --ok:#14915A; --ok-soft:#D3F1E2; --warn:#B86E00; --warn-soft:#FBEACB; --bad:#C23A3A;
  --body:#D3D9E3; --muscle:#BCC4D1; --muscle-sec:#96ABFF; --scrim:rgba(14,21,34,.45);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --tab-h:62px; --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0E15; --surface:#131925; --surface-2:#1B2331; --ink:#EDF0F6; --ink-2:#A9B2C2; --ink-3:#6C778A;
  --line:#232D3E; --accent:#6D8BFF; --accent-ink:#0A0E15; --accent-soft:#1C2850;
  --ok:#3CC985; --ok-soft:#10301F; --warn:#F0A72E; --warn-soft:#352709; --bad:#FF7A7A;
  --body:#263044; --muscle:#323D52; --muscle-sec:#3F5299; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0E15; --surface:#131925; --surface-2:#1B2331; --ink:#EDF0F6; --ink-2:#A9B2C2; --ink-3:#6C778A;
  --line:#232D3E; --accent:#6D8BFF; --accent-ink:#0A0E15; --accent-soft:#1C2850;
  --ok:#3CC985; --ok-soft:#10301F; --warn:#F0A72E; --warn-soft:#352709; --bad:#FF7A7A;
  --body:#263044; --muscle:#323D52; --muscle-sec:#3F5299; --scrim:rgba(0,0,0,.6); color-scheme:dark}

[hidden]{display:none!important}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;-webkit-text-size-adjust:100%}
img{max-width:100%}
.sync-badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-3)}
.sync-badge i{width:8px;height:8px;border-radius:9px;background:var(--ink-3)}
.sync-badge.ok i{background:var(--ok)} .sync-badge.err i{background:var(--bad)} .sync-badge.busy i{background:var(--warn)}
details.sql summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent)}
details.sql pre{background:var(--surface-2);border-radius:10px;padding:10px;font-size:11.5px;overflow-x:auto;white-space:pre}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.005em;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:32px} h2{font-size:26px} h3{font-size:19px;font-weight:600}
p{margin:0}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}

#view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(var(--tab-h) + 104px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--surface-2);color:var(--ink-2)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}

.card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{background:transparent;padding:0}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* week strip */
.strip{display:grid;grid-template-columns:28px repeat(7,1fr) 28px;align-items:center;gap:2px}
.strip .arr{height:44px;display:grid;place-items:center;color:var(--ink-3);border-radius:10px}
.day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 8px;border-radius:12px;min-width:0}
.day .dl{font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.day .dn{font-family:var(--f-display);font-size:20px;font-weight:600;line-height:1}
.day .dot{width:6px;height:6px;border-radius:99px;background:transparent}
.day.sel{background:var(--ink);color:var(--bg)} .day.sel .dl{color:inherit;opacity:.7}
.day.istoday:not(.sel) .dn{color:var(--accent)}
.dot.done{background:var(--ok)} .dot.missed{background:var(--bad)} .dot.planned,.dot.today{background:var(--ink-3)} .dot.rest{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink-3)} .dot.skip{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink-3)}

/* session */
.sess-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sess-h h2{font-size:34px}
.meta{display:flex;gap:16px;flex-wrap:wrap}
.meta div{display:flex;flex-direction:column}
.meta b{font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.1}
.meta span{font-size:12px;color:var(--ink-3)}
.exlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.exrow{width:100%;display:grid;grid-template-columns:28px 1fr auto 14px;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);text-align:left}
.exlist li:first-child .exrow{border-top:0}
.exnum{font-family:var(--f-display);font-weight:600;font-size:16px;color:var(--ink-3);text-align:center}
.exname{font-weight:600;min-width:0}
.exname small{display:block;font-weight:400;font-size:12.5px;color:var(--ink-3)}
.exrx{font-family:var(--f-display);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.chev{color:var(--ink-3)}
.exrx .load{display:block;text-align:right;font-family:var(--f-body);font-size:12.5px;font-weight:600;color:var(--accent);letter-spacing:0}
.note{font-size:13.5px;padding:10px 12px;border-radius:12px;background:var(--surface-2);color:var(--ink-2)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.ok{background:var(--ok-soft);color:var(--ok)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:12px;font-weight:600;background:var(--surface-2);color:var(--ink)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok-soft);color:var(--ok)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.sm{height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn.danger{color:var(--bad)}
.fab{position:fixed;z-index:20;left:0;right:0;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 10px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.fab .btn{pointer-events:auto;max-width:560px;margin:0 auto;display:flex;width:100%;height:54px;font-size:17px;box-shadow:0 8px 24px -8px rgba(30,60,200,.55)}

/* cardio */
.cardio{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.cicon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.cbody{display:flex;flex-direction:column;gap:4px;min-width:0}
.cbody h3 span{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--ink-3);margin-left:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0}
.macro{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.macro div{display:flex;flex-direction:column;align-items:flex-start}
.macro b{font-family:var(--f-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.macro span{font-size:12px;color:var(--ink-3)}
.mob{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.mob li{display:flex;gap:8px} .mob li::before{content:"";flex:none;width:6px;height:6px;border-radius:2px;background:var(--accent);margin-top:8px}

/* tab bar */
.tabs{position:fixed;z-index:30;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tab-h)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.tab.on{color:var(--accent)}
.tab svg{width:23px;height:23px}

/* plan */
.phase{display:grid;grid-template-columns:6px 1fr;gap:12px;padding:14px;border-radius:var(--r);background:var(--surface)}
.phase .bar{border-radius:4px;background:var(--surface-2)}
.phase.cur .bar{background:var(--accent)}
.phase .pb{display:flex;flex-direction:column;gap:6px;min-width:0}
.split{width:100%;border-collapse:collapse;font-size:14px}
.split td{padding:8px 4px;border-top:1px solid var(--line);vertical-align:top}
.split tr:first-child td{border-top:0}
.split td:first-child{font-family:var(--f-display);font-weight:600;font-size:16px;width:44px;color:var(--ink-3)}
.split td:last-child{color:var(--ink-2);text-align:right;white-space:nowrap}
.weeks{display:flex;flex-direction:column}
.wk{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;padding:11px 2px;border-top:1px solid var(--line);text-align:left;width:100%}
.wk:first-child{border-top:0}
.wk .wn{font-family:var(--f-display);font-size:20px;font-weight:700}
.wk.cur .wn{color:var(--accent)}
.pips{display:flex;gap:3px}
.pips i{width:8px;height:16px;border-radius:3px;background:var(--surface-2)}
.pips i.on{background:var(--ok)}
.phase-h{padding:8px 2px 2px}

/* progress */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--f-display);font-size:28px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--ink-3)}
.wform{display:flex;gap:8px}
.field{height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:0 12px;min-width:0;flex:1;font-variant-numeric:tabular-nums}
.field:focus{border-color:var(--accent);outline:none}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-body);font-size:10px;fill:var(--ink-3)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px;background:var(--accent)}
.legend i.t{background:none;border-top:2px dashed var(--ink-3);height:0}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center;text-align:left;width:100%}
.li:first-child{border-top:0}
.li small{display:block;font-size:12.5px;color:var(--ink-3)}
.li .r{font-family:var(--f-display);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.set-grid label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2);min-width:0}
.set-grid .field{flex:none;width:100%}

/* library */
.search{position:relative}
.search .field{width:100%;padding-left:40px}
.search svg{position:absolute;left:12px;top:13px;color:var(--ink-3)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .chip{flex:none;height:34px;padding:0 14px;font-size:14px}
.filters .chip.on{background:var(--ink);color:var(--bg)}
.lib{display:flex;flex-direction:column;gap:8px}
.libi{display:grid;grid-template-columns:72px 1fr 14px;gap:12px;align-items:center;background:var(--surface);border-radius:14px;padding:8px 12px 8px 8px;text-align:left;width:100%}
.libi .mmap{width:72px}
.libi b{font-weight:600;display:block}
.libi small{font-size:12.5px;color:var(--ink-3)}

/* muscle map */
.mmap{width:100%;height:auto;display:block}
.mmap .b{fill:var(--body)}
.mmap .m{stroke:var(--surface);stroke-width:.9}
.mmap text{font-family:var(--f-body);font-size:10px;fill:var(--ink-3)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:60;background:var(--scrim)}
.sheet{position:fixed;z-index:61;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);animation:up .22s ease-out}
.sheet-in{max-width:560px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 4px}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:26px 1fr;gap:10px;font-size:14.5px}
.steps li::before{content:counter(s);font-family:var(--f-display);font-weight:700;font-size:15px;width:26px;height:26px;border-radius:99px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.bul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.bul li{display:grid;grid-template-columns:16px 1fr;gap:6px}
.bul.good li::before{content:"✓";color:var(--ok);font-weight:700}
.bul.bad li::before{content:"✕";color:var(--bad);font-weight:700}
.mapbox{background:var(--surface);border-radius:var(--r);padding:12px 24px}
.link{color:var(--accent);font-weight:600;text-decoration:none;display:inline-flex;gap:6px;align-items:center}

/* workout overlay */
.wo{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.wo-h{background:var(--surface);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.wo-h .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.wo-h .t{flex:1;min-width:0}
.wo-h .t b{font-family:var(--f-display);font-size:22px;font-weight:700;display:block;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wo-h .t span{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.wo-b{flex:1;overflow-y:auto;padding:14px max(12px,env(safe-area-inset-right,0px)) 140px max(12px,env(safe-area-inset-left,0px))}
.wo-b .wrap{gap:12px}
.wex{background:var(--surface);border-radius:var(--r);padding:14px 12px;display:flex;flex-direction:column;gap:8px}
.wex-name{font-family:var(--f-display);font-size:21px;font-weight:700;color:var(--accent);text-align:left;line-height:1.1}
.wex-rx{font-size:13px;color:var(--ink-2)}
.hint{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:7px 10px}
.sets{display:flex;flex-direction:column;gap:4px}
.set{display:grid;grid-template-columns:30px 1fr 64px 56px 44px;gap:6px;align-items:center;border-radius:10px;padding:3px 2px}
.set.hd{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding-block:0}
.set.hd span{text-align:center} .set.hd span:nth-child(2){text-align:left}
.set .sn{font-family:var(--f-display);font-weight:700;font-size:17px;text-align:center}
.set .pv{font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.set input{height:40px;width:100%;border-radius:9px;border:0;background:var(--surface-2);text-align:center;font-family:var(--f-display);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;padding:0 2px}
.set input::placeholder{color:var(--ink-3);font-weight:500}
.set input:focus{outline:2px solid var(--accent);outline-offset:0}
.chk{height:40px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-3)}
.set.done{background:var(--ok-soft)}
.set.done input{background:transparent}
.set.done .chk{background:var(--ok);color:#fff}
.set-act{display:flex;gap:8px}
.set-act .btn{flex:1}
.toggle{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.box{width:26px;height:26px;border-radius:8px;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;flex:none;color:transparent}
.toggle.on .box{background:var(--ok);box-shadow:none;color:#fff}
textarea.field{height:auto;min-height:70px;padding:10px 12px;resize:vertical;width:100%}
.restbar{position:absolute;left:0;right:0;bottom:0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px,env(safe-area-inset-left,0px));background:var(--ink);color:var(--bg)}
.restbar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.restbar .tm{font-family:var(--f-display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;flex:1;line-height:1}
.restbar .tm small{font-family:var(--f-body);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.65;display:block}
.restbar .btn{background:rgba(127,140,170,.25);color:inherit;height:40px;padding:0 12px}
.prog{position:absolute;left:0;top:0;height:3px;background:var(--accent);transition:width .25s linear}
.confirm{position:absolute;left:0;right:0;bottom:0;z-index:2;background:var(--surface);border-top:1px solid var(--line);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -12px 30px -12px rgba(0,0,0,.25)}
.confirm .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.confirm .row .btn{flex:1}

.planbar{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.planbar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.ckrow{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2);font-weight:600}
.ckrow .field{flex:none;width:100%}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface-2);padding:3px;border-radius:11px}
.seg.c4{grid-template-columns:repeat(4,1fr)}
.seg button{height:36px;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.lvl{display:flex;flex-direction:column;gap:6px}
.lvl button{text-align:left;padding:10px 12px;border-radius:12px;box-shadow:inset 0 0 0 1.5px var(--line);font-size:14px}
.lvl button b{display:block}
.lvl button.on{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
input[type=range]{width:100%;accent-color:var(--accent)}
.tests{width:100%;border-collapse:collapse;font-size:13.5px}
.tests th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:4px 2px;text-align:center}
.tests th:first-child{text-align:left}
.tests td{padding:4px 2px;border-top:1px solid var(--line);vertical-align:middle}
.tests td:first-child{min-width:110px}
.tests input{width:100%;min-width:44px;height:36px;border-radius:8px;border:0;background:var(--surface-2);text-align:center;font-family:var(--f-display);font-size:16px;font-weight:600}
.toast{position:fixed;z-index:80;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.empty{text-align:center;padding:18px 8px;color:var(--ink-3);font-size:14px}
.hero-goal{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:8px}
.hero-goal .eyebrow{color:inherit;opacity:.6}
.hero-goal h2{font-size:30px}
.hero-goal .stats{display:flex;gap:20px;flex-wrap:wrap;margin-top:4px}
.hero-goal .stats b{font-family:var(--f-display);font-size:24px;font-weight:600;display:block;line-height:1.1}
.hero-goal .stats span{font-size:12px;opacity:.65}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}.prog{transition:none}}

function dbWrite(id, data){
  S.stamps = Object.assign({}, S.stamps, {[id]: Date.now()});
  if (id.startsWith("w_")) { const d = id.slice(2), del = Object.assign({}, S.deleted); if (data === null) del[d] = Date.now(); else delete del[d]; S.deleted = del; }

function mergeStates(L, R){
  const ls = k => (L.stamps||{})[k]||0, rs = k => (R.stamps||{})[k]||0, rNewer = k => rs(k) > ls(k);
  const out = {stamps:{}, deleted:{}, workouts:{}};
  new Set(Object.keys(L.stamps||{}).concat(Object.keys(R.stamps||{}))).forEach(k => { out.stamps[k] = Math.max(ls(k), rs(k)); });
  const dates = new Set([].concat(Object.keys(L.workouts||{}), Object.keys(R.workouts||{}), Object.keys(L.deleted||{}), Object.keys(R.deleted||{})));
  dates.forEach(d => { const k = "w_"+d, s = rNewer(k) ? R : L, o = s === R ? L : R;
    if (s.workouts && s.workouts[d]) out.workouts[d] = s.workouts[d];
    else if (s.deleted && s.deleted[d]) out.deleted[d] = s.deleted[d];
    else if (o.workouts && o.workouts[d] && !(o.deleted && o.deleted[d])) out.workouts[d] = o.workouts[d]; });
  const mapMerge = (k, a, b) => rNewer(k) ? Object.assign({}, a||{}, b||{}) : Object.assign({}, b||{}, a||{});
  out.weights = mapMerge("weights", L.weights, R.weights);
  out.checkins = mapMerge("checkins", L.checkins, R.checkins);
  out.tests = {}; new Set(Object.keys(L.tests||{}).concat(Object.keys(R.tests||{}))).forEach(t => { out.tests[t] = mapMerge("tests", (L.tests||{})[t], (R.tests||{})[t]); });
  const listMerge = (k, a, b) => { const m = {}, first = rNewer(k) ? (a||[]) : (b||[]), second = rNewer(k) ? (b||[]) : (a||[]);
    first.concat(second).forEach(x => { if (x && x.id) m[x.id] = x; }); return Object.values(m).sort((x,y) => (x.date||x.from||"") < (y.date||y.from||"") ? -1 : 1); };
  out.pains = listMerge("pains", L.pains, R.pains);
  out.runs = listMerge("runs", L.runs, R.runs).slice(-400);
  out.settings = Object.assign({start:START_DEFAULT, startWeight:59.5}, rNewer("settings") ? R.settings : L.settings);
  out.protein = (rNewer("protein") ? R.protein : L.protein) || {date:"", items:[]};
  return out;
}

const SB_CFG = "ete27.supabase", SB_AUTH = "ete27.auth", SB_TABLE = "ete_state";
const SETUP_SQL = `create table if not exists public.ete_state (

  data jsonb not null default '{}'::jsonb,
  updated_at timestamptz not null default now()

create policy "ete_state_select_own" on public.ete_state for select using (auth.uid() = user_id);
create policy "ete_state_insert_own" on public.ete_state for insert with check (auth.uid() = user_id);
create policy "ete_state_update_own" on public.ete_state for update using (auth.uid() = user_id) with check (auth.uid() = user_id);`;
function sbConfig(){
  let c = lsGet(SB_CFG);

    if (v8) { const url = v8.url || v8.supabaseUrl, key = v8.anonKey || v8.key || v8.anon || v8.supabaseKey; if (url && key) { c = {url, key, fromV8:true}; lsSet(SB_CFG, c); } } }
  return c && c.url && c.key ? c : null;
}
let sb = null, pushT = null, syncBusy = false, syncAgain = false;
function sbClient(){
  if (sb) return sb; const c = sbConfig(); if (!c || !window.supabase) return null;
  try { if (c.fromV8 && !localStorage.getItem(SB_AUTH) && localStorage.getItem("projetV8.auth")) localStorage.setItem(SB_AUTH, localStorage.getItem("projetV8.auth")); } catch(e) {}
  try { sb = window.supabase.createClient(c.url, c.key, {auth:{storageKey:SB_AUTH, persistSession:true, autoRefreshToken:true}}); } catch(e) { sb = null; }
  return sb;
}
function schedulePush(){ clearTimeout(pushT); pushT = setTimeout(syncNow, 1500); }
async function syncNow(){
  if (!sbConfig()) { SYNC = "off"; renderSync(); return; }
  if (!window.supabase) { SYNC = navigator.onLine ? "error" : "offline"; SYNC_ERR = "Bibliothèque Supabase non chargée."; renderSync(); return; }
  const c = sbClient(); if (!c) { SYNC = "error"; SYNC_ERR = "URL ou clé Supabase invalide."; renderSync(); return; }
  if (syncBusy) { syncAgain = true; return; }
  syncBusy = true;
  try {
    const { data:{ session } } = await c.auth.getSession();
    const email = session ? session.user.email : null;
    if (email !== UI.sbUser) { UI.sbUser = email; if (UI.tab === "progres") renderMain(); }
    if (!session) { SYNC = "signedout"; return; }
    if (!navigator.onLine) { SYNC = "offline"; return; }
    SYNC = "syncing"; renderSync();
    const uid = session.user.id;
    const { data, error } = await c.from(SB_TABLE).select("data").eq("user_id", uid).maybeSingle();
    if (error) throw error;
    if (data && data.data && data.data.stamps) {
      const merged = mergeStates(S, data.data);
      if (JSON.stringify(merged) !== JSON.stringify(S)) { S = merged; persistLocal(); if (!UI.sheet || UI.sheet.charAt(0) !== "@") renderMain(); }
    }
    const { error: e2 } = await c.from(SB_TABLE).upsert({user_id:uid, data:S, updated_at:new Date().toISOString()});
    if (e2) throw e2;
    SYNC = "ok"; SYNC_AT = Date.now(); SYNC_ERR = "";
  } catch(e) {
    console.warn(e); SYNC = "error";
    SYNC_ERR = /ete_state|relation|does not exist|schema cache/i.test((e && e.message) || "") ? "La table ete_state n’existe pas encore : lance le script SQL ci-dessous dans Supabase." : ((e && e.message) || "Erreur inconnue.");
  } finally { syncBusy = false; renderSync(); if (syncAgain) { syncAgain = false; schedulePush(); } }
}

    if (inf.deload) h += '<div class="note warn">Semaine de décharge : une série de moins, charges −20 %, aucune série à l’échec. C’est là que ton corps assimile le travail.</div>';
    if (co.banners.length) h += '<div class="note warn">Adaptée à tes douleurs. Les exercices habituellement debout (curls, élévations, face pull) peuvent se faire assis sur le banc si rester debout te gêne.</div>';
    h += '<ol class="exlist">' + list.map((x,i) => { const sg = suggestKg(x.id, x.ty, x.r.reps, prevSets(x.id, UI.sel), inf.deload);
      return '<li><button class="exrow" data-act="ex" data-id="'+x.id+'"><span class="exnum">'+(i+1)+'</span><span class="exname">'+EX[x.id].n+'<small>'+EX[x.id].p.map(m=>MUSC[m]).join(" · ")+'</small></span><span class="exrx">'+x.r.sets+' × '+x.r.reps+(EX[x.id].side?'<small class="faint" style="font-size:12px;font-family:var(--f-body)"> /côté</small>':'')+'<span class="load">'+fmtLoad(x.id, sg.kg)+'</span></span><span class="chev">'+IC.chev+'</span></button></li>'; }).join("") + '</ol>';
    h += '<p class="faint" style="font-size:13px">Échauffement : 5 min de vélo, puis 2 séries légères du premier exercice.</p>';
    if (w && w.gym){
      const pr = wPRs(UI.sel);
      h += '<div class="meta" style="padding-top:4px;border-top:1px solid var(--line)"><div><b>'+fmtDur(w.dur||0)+'</b><span>durée</span></div><div><b>'+wSets(w)+'</b><span>séries faites</span></div><div><b>'+fmtKg(wVolume(w)/1000)+' t</b><span>volume</span></div>'+(pr?'<div><b style="color:var(--ok)">'+pr+'</b><span>record'+(pr>1?'s':'')+'</span></div>':'')+'</div>';
      h += '<button class="btn ghost block" data-act="edit" data-d="'+UI.sel+'">'+(w.quick?'Détailler la séance':'Voir ou modifier la séance')+'</button>';
    } else {
      h += '<button class="btn ghost block sm" data-act="quick" data-d="'+UI.sel+'">Valider sans détail (séance faite, rien à noter)</button>';
      fab.hidden = false;
      fab.innerHTML = DRAFT ? '<button class="btn pri" data-act="resume">Reprendre la séance en cours</button>' : '<button class="btn pri" data-act="start" data-d="'+UI.sel+'">Commencer la séance</button>';
    }
    h += '</section>';
  } else {
    h += '<section class="card"><div class="eyebrow">Repos musculation</div><h2>'+sess.name+'</h2><p class="muted">'+sess.sub+'. Les muscles grossissent pendant la récupération, pas pendant la séance.</p></section>';
  }
  // cardio
  const c = cardioFor(inf.ckey, ph, inf.deload, co.flags), cdone = !!(w && w.cardio);
  if (inf.week === FOUR_DAY_WEEKS + 1 && inf.wd === 0) h += '<div class="note ok">Cette semaine, tu passes à 5 séances : Push, Pull, Jambes, Épaules & bras, Torse & abdos.</div>';
  if (c.dur > 0) {
    h += '<section class="card"><div class="cardio"><div class="cicon">'+IC[c.t]+'</div><div class="cbody"><div class="eyebrow">'+(c.t==="run"?"Course":"Vélo")+'</div><h3>'+c.name+'<span>'+c.dur+' min</span></h3>' +
      '<dl class="kv"><dt>Intensité</dt><dd>'+c.z+'</dd><dt>Quand</dt><dd>'+c.when+'</dd></dl><p class="muted" style="font-size:14px">'+c.det+'</p></div></div>' +
      '<button class="toggle'+(cdone?' on':'')+'" data-act="cardio" data-d="'+UI.sel+'"><span class="box">'+IC.check+'</span><span>'+(cdone?'Cardio fait':'Marquer le cardio comme fait')+'</span></button></section>';
  } else {
    h += '<section class="card"><div class="eyebrow">Cardio</div><h3>Repos complet</h3><p class="muted" style="font-size:14px">'+c.det+'</p></section>';
  }
  h += runsCard();
  if (sess.rest || co.ready === 2) h += '<section class="card"><h3>Mobilité, 15 min</h3><ul class="mob">'+MOBILITY.map(x=>'<li>'+x+'</li>').join("")+'</ul></section>';
  // nutrition
  const pt = proteinToday().reduce((a,i)=>a+FOODS[i][1],0), pct = Math.min(100, pt/ph.p*100);
  h += '<section class="card"><div class="row"><div class="cicon" style="width:36px;height:36px">'+IC.food+'</div><div><div class="eyebrow">Nutrition · '+(ph.mode==="cut"?"sèche":"prise de muscle")+'</div><h3>Tes cibles du jour</h3></div></div>' +
    '<div class="macro"><div><b>'+ph.kcal.toLocaleString("fr-FR")+'</b><span>kcal</span></div><div><b>'+ph.p+' g</b><span>protéines</span></div><div><b>'+ph.g+' g</b><span>glucides</span></div><div><b>'+ph.l+' g</b><span>lipides</span></div></div>';
  if (UI.sel === t) {
    h += '<div class="between"><h3 style="font-size:17px">Compteur de protéines</h3><span class="num" style="font-size:20px;font-weight:600">'+pt+' <span class="faint" style="font-size:15px">/ '+ph.p+' g</span></span></div><div class="planbar"><i style="width:'+pct.toFixed(0)+'%;background:'+(pct>=100?'var(--ok)':'var(--accent)')+'"></i></div>' +
      (proteinToday().length ? '<div class="chips">'+proteinToday().map((i,j)=>'<button class="chip ok" data-act="protRm" data-j="'+j+'" aria-label="Retirer '+FOODS[i][0]+'">'+FOODS[i][0]+' · '+FOODS[i][1]+' g ✕</button>').join("")+'</div>' : '') +
      '<p class="faint" style="font-size:13px">Touche un aliment quand tu le manges. Le compteur repart à zéro chaque jour.</p><div class="chips">'+FOODS.map((f,i)=>'<button class="chip" data-act="prot" data-i="'+i+'">+ '+f[0]+' <b>'+f[1]+' g</b></button>').join("")+'</div>';
  }
  h += '<p class="faint" style="font-size:13px">Estimations à ajuster selon ta courbe de poids (onglet Progrès). Répartis les protéines sur 4 repas de 25 à 35 g.</p></section>';
  return h;
}

/* ---- Programme ---- */

  h += '<section class="card"><div class="between"><h3>Semaines 1 à '+FOUR_DAY_WEEKS+'</h3><span class="chip acc">4 séances</span></div>' + splitTable(TPL4) +

  PHASES.forEach(p => {
    h += '<div class="phase-h eyebrow">'+p.name+'</div><section class="card" style="padding-block:6px"><div class="weeks">';

      const isCur = !cur.before && cur.week===w;
      h += '<button class="wk'+(isCur?' cur':'')+'" data-act="gotow" data-d="'+ks(mon)+'"><span class="wn">S'+w+'</span><span><span style="font-weight:600">'+fmtShort(mon)+' → '+fmtShort(addDays(mon,6))+'</span>'+(p.deload.includes(w)?' <span class="chip warn" style="padding:1px 8px;font-size:11.5px">Décharge</span>':'')+(isCur?' <span class="chip acc" style="padding:1px 8px;font-size:11.5px">Cette semaine</span>':'')+'</span><span class="pips" aria-label="'+done+' séances sur '+gi.length+'">'+gi.map((x,i)=>'<i class="'+(i<done?'on':'')+'"></i>').join("")+'</span></button>';
    }
    h += '</div></section>';
  });
  return h;
}

/* ---- Progrès ---- */

function enduranceChart(){
  const start = pd(S.settings.start), cur = info(new Date());
  const lastW = cur.before ? 1 : Math.min(cur.week, WEEKS), firstW = Math.max(1, lastW-7), data = [];
  for (let w=firstW; w<=lastW; w++){ const a = ks(addDays(start,(w-1)*7)), b = ks(addDays(start,w*7-1));
    let run = 0, bike = 0; S.runs.forEach(r => { if (r.date>=a && r.date<=b) { if (r.type==="bike") bike += r.min||0; else run += r.min||0; } }); data.push([w, run, bike]); }
  if (!data.some(d=>d[1]+d[2]>0)) return '<p class="empty">Note tes sorties depuis l’onglet Séance pour voir tes minutes de course et de vélo.</p>';
  const W=340,H=150,L=30,R=6,T=16,B=22, mx = Math.max(...data.map(d=>d[1]+d[2])), top = Math.max(60, Math.ceil(mx/60)*60), bw = (W-L-R)/data.length;
  let s = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Minutes de course et de vélo par semaine">';
  [0, top/2, top].forEach(v => { const yy = T+(1-v/top)*(H-T-B); s += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--line)"/><text x="'+(L-5)+'" y="'+(yy+3.5)+'" text-anchor="end">'+(v/60 >= 1 ? fmtKg(v/60)+' h' : v)+'</text>'; });
  data.forEach(([w,run,bike],i) => { const sc = (H-T-B)/top, xx = L+i*bw+bw*0.2, hb = bike*sc, hr = run*sc;
    s += '<rect x="'+xx+'" y="'+(H-B-hb)+'" width="'+(bw*0.6)+'" height="'+hb+'" fill="var(--muscle-sec)"/><rect x="'+xx+'" y="'+(H-B-hb-hr)+'" width="'+(bw*0.6)+'" height="'+hr+'" fill="var(--accent)"/><text x="'+(xx+bw*0.3)+'" y="'+(H-7)+'" text-anchor="middle">S'+w+'</text>'; });
  return s + '</svg><div class="legend"><span><i></i>Course</span><span><i style="background:var(--muscle-sec)"></i>Vélo</span></div>';
}
function weightChart(){
  const W=340,H=180,L=30,R=12,T=12,B=24, start=pd(S.settings.start), span=WEEKS*7-1;
  const ents = Object.keys(S.weights).sort().map(k => [k, S.weights[k]]).filter(([k]) => { const x = diffDays(start,pd(k)); return x>=0 && x<=span; });
  const vals = ents.map(e=>e[1]).concat([S.settings.startWeight, S.settings.startWeight+5]);
  const lo = Math.floor(Math.min(...vals) - 1), hi = Math.ceil(Math.max(...vals) + 1);
  const x = d => L + diffDays(start,d)/span*(W-L-R), y = v => T + (hi-v)/(hi-lo)*(H-T-B);
  let s = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Courbe de poids">';
  const step = (hi-lo) > 8 ? 2 : 1;
  for (let v=lo; v<=hi; v+=step){ s += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(y(v)+3.5)+'" text-anchor="end">'+v+'</text>'; }
  for (let m=0;m<9;m++){ const d = new Date(start.getFullYear(), start.getMonth()+m+1, 1); const xd = diffDays(start,d); if (xd>span) break; s += '<text x="'+x(d)+'" y="'+(H-6)+'" text-anchor="middle">'+MOISC[d.getMonth()]+'</text>'; }
  const tp = [0, 18*7, span].map(i => { const d = addDays(start,i); return x(d).toFixed(1)+","+y(targetAt(d)).toFixed(1); });
  s += '<polyline points="'+tp.join(" ")+'" fill="none" stroke="var(--ink-3)" stroke-width="1.5" stroke-dasharray="4 4"/>';
  const tx = x(new Date()); if (tx>=L && tx<=W-R) s += '<line x1="'+tx+'" x2="'+tx+'" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--accent)" stroke-opacity=".25" stroke-width="1"/>';
  if (ents.length){
    const pts = ents.map(([k,v]) => x(pd(k)).toFixed(1)+","+y(v).toFixed(1));
    if (ents.length>1) s += '<polyline points="'+pts.join(" ")+'" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
    ents.forEach(([k,v],i) => { const last = i===ents.length-1; s += '<circle cx="'+x(pd(k))+'" cy="'+y(v)+'" r="'+(last?4.5:2.6)+'" fill="var(--accent)"'+(last?' stroke="var(--surface)" stroke-width="2"':'')+'/>'; });
    const [lk,lv] = ents[ents.length-1], lx = x(pd(lk));
    s += '<text x="'+Math.min(lx, W-R-20)+'" y="'+(y(lv)-9)+'" text-anchor="middle" style="font-weight:600;fill:var(--ink)">'+fmtKg(lv)+'</text>';
  } else {
    s += '<text x="'+((L+W-R)/2)+'" y="'+((T+H-B)/2)+'" text-anchor="middle">Ta première pesée apparaîtra ici</text>';
  }
  return s + '</svg>';
}
function trendNote(){
  const now = new Date(), ph = info(now).phase;
  const ents = Object.keys(S.weights).sort().map(k => [diffDays(now,pd(k)), S.weights[k]]).filter(e => e[0] >= -21);
  if (ents.length < 3 || ents[ents.length-1][0] - ents[0][0] < 7) return '<p class="note">Pèse-toi 2 à 3 fois par semaine, le matin à jeun. Après 7 jours de mesures, l’appli te dira si tu dois ajuster tes calories.</p>';
  const n = ents.length, mx = ents.reduce((a,e)=>a+e[0],0)/n, my = ents.reduce((a,e)=>a+e[1],0)/n;
  const slope = ents.reduce((a,e)=>a+(e[0]-mx)*(e[1]-my),0) / ents.reduce((a,e)=>a+(e[0]-mx)**2,0) * 7;
  const sl = (slope>=0?"+":"−")+fmtKg(Math.abs(slope))+" kg par semaine";
  if (ph.mode === "bulk"){
    if (slope < 0.15) return '<p class="note warn">Tendance : '+sl+'. Tu ne prends pas assez. Ajoute 150 à 200 kcal par jour (un bol de riz ou un shaker lait et flocons d’avoine).</p>';
    if (slope > 0.4) return '<p class="note warn">Tendance : '+sl+'. Ça monte trop vite (au-delà de 0,5 % du poids par semaine, c’est surtout du gras). Retire 150 kcal par jour.</p>';
    return '<p class="note ok">Tendance : '+sl+'. Dans la cible (0,15 à 0,4 kg par semaine) pour prendre du muscle sans trop de gras. Continue.</p>';
  }
  if (slope > -0.1) return '<p class="note warn">Tendance : '+sl+'. Le poids stagne. Retire 150 kcal par jour ou ajoute 20 min de Z2 à deux séances.</p>';
  if (slope < -0.4) return '<p class="note warn">Tendance : '+sl+'. Tu descends trop vite (au-delà de 0,5 % du poids par semaine) et risques de perdre du muscle. Ajoute 150 kcal par jour.</p>';
  return '<p class="note ok">Tendance : '+sl+'. Rythme de sèche idéal (0,1 à 0,4 kg par semaine). Continue.</p>';
}
function volumeChart(){
  const start = pd(S.settings.start), cur = info(new Date());
  if (cur.before) return '<p class="empty">Le graphique démarre avec ta première semaine.</p>';
  const lastW = Math.min(cur.week, WEEKS), firstW = Math.max(1, lastW-7), data = [];
  for (let w=firstW; w<=lastW; w++){ const a = ks(addDays(start,(w-1)*7)), b = ks(addDays(start,w*7-1)); let v = 0; gymDates().forEach(d => { if (d>=a && d<=b) v += wVolume(S.workouts[d]); }); data.push([w, v/1000]); }
  if (!data.some(d=>d[1]>0)) return '<p class="empty">Enregistre ta première séance pour voir ton volume.</p>';
  const W=340,H=150,L=28,R=6,T=16,B=22, mx = Math.max(...data.map(d=>d[1])), top = Math.max(1, Math.ceil(mx/5)*5);
  const bw = (W-L-R)/data.length;
  let s = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Volume par semaine en tonnes">';
  [0, top/2, top].forEach(v => { const yy = T+(1-v/top)*(H-T-B); s += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--line)"/><text x="'+(L-5)+'" y="'+(yy+3.5)+'" text-anchor="end">'+fmtKg(v)+'</text>'; });
  data.forEach(([w,v],i) => { const hgt = v/top*(H-T-B), xx = L+i*bw+bw*0.2, last = i===data.length-1;
    s += '<rect x="'+xx+'" y="'+(H-B-hgt)+'" width="'+(bw*0.6)+'" height="'+Math.max(hgt,0)+'" rx="3" fill="'+(last?'var(--accent)':'var(--muscle-sec)')+'"/><text x="'+(xx+bw*0.3)+'" y="'+(H-7)+'" text-anchor="middle">S'+w+'</text>';
    if (v>0) s += '<text x="'+(xx+bw*0.3)+'" y="'+(H-B-hgt-4)+'" text-anchor="middle" style="fill:var(--ink-2)">'+fmtKg(Math.round(v*10)/10)+'</text>'; });
  return s + '</svg><p class="faint" style="font-size:13px">En tonnes (charge × répétitions). Le volume doit monter pendant la prise, puis se maintenir pendant la sèche.</p>';
}

let wakeLock = null, audioCtx = null;
const REST = {end:0, total:0, beeped:true, lastTick:0, next:""};
function tone(freq, dur, vol){ try { ensureAudio(); if (!audioCtx) return; const t0 = audioCtx.currentTime, o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = freq; g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0+0.015); g.gain.exponentialRampToValueAtTime(0.0001, t0+dur); o.connect(g).connect(audioCtx.destination); o.start(t0); o.stop(t0+dur+0.02); } catch(e){} }
function ensureAudio(){ try { if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); if (audioCtx.state==="suspended") audioCtx.resume(); } catch(e){} }
function beep(){ try { ensureAudio(); if (!audioCtx) return; [0,0.2].forEach((t0,n) => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = n ? 1175 : 880; g.gain.setValueAtTime(0.0001, audioCtx.currentTime+t0); g.gain.exponentialRampToValueAtTime(0.35, audioCtx.currentTime+t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+t0+(n?0.45:0.18)); o.connect(g).connect(audioCtx.destination); o.start(audioCtx.currentTime+t0); o.stop(audioCtx.currentTime+t0+0.5); }); } catch(e){} try { navigator.vibrate && navigator.vibrate([250,100,250]); } catch(e){} }
async function lockScreen(){ try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request("screen"); } catch(e){ wakeLock = null; } }
function unlockScreen(){ try { wakeLock && wakeLock.release(); } catch(e){} wakeLock = null; }

function renderWO(){
  const el = $("#wo");

  const sc = el.querySelector(".wo-b"), top = sc ? sc.scrollTop : 0;
  const inf = info(pd(DRAFT.date)), doneSets = DRAFT.ex.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0), allSets = DRAFT.ex.reduce((a,e)=>a+e.sets.length,0);

  h += '<div class="wo-b"><div class="wrap">';
  DRAFT.ex.forEach((e,i) => {
    const ex = EX[e.id], prev = prevSets(e.id, DRAFT.date);
    const toFail = (e.ty === "I" || e.ty === "I+") && inf.phase.id !== "F" && !inf.deload;
    h += '<div class="wex"><button class="wex-name" data-act="ex" data-id="'+e.id+'">'+ex.n+'</button><div class="wex-rx">'+e.nsets+' × '+e.reps+(ex.side?' par côté':'')+' · repos '+fmtRest(e.rest)+' · '+e.rir+' rep'+(e.rir>1?'s':'')+' en réserve'+(toFail?', <b>dernière série jusqu’à l’échec</b>':'')+(ex.bw?' · kg = lest':'')+'</div>';
    const sug = suggestKg(e.id, e.ty, e.reps, prev, inf.deload);
    const lo = String(e.reps).split("-")[0], hi = topReps(e.reps);
    h += '<div class="hint"><b>Charge conseillée : '+fmtLoad(e.id, sug.kg)+'</b> · '+sug.why+'.'+(sug.start ? '<br>Ajuste dès la 1re série : plus de '+hi+' reps faciles, monte de 2,5 kg ; moins de '+lo+', descends.'+(e.id==="pullup"?' Si tu n’arrives pas à '+lo+' tractions, fais-en le maximum et complète avec des descentes lentes.':'') : '')+'</div>';
    h += '<div class="sets"><div class="set hd"><span>Série</span><span>Précédent</span><span>kg</span><span>Reps</span><span>✓</span></div>';
    e.sets.forEach((s,j) => {
      const p = prev && (prev.sets[j] || prev.sets[prev.sets.length-1]);
      const kgPh = sug ? fmtKg(sug.kg) : (p ? fmtKg(p.kg) : ""), repPh = p ? String(p.reps) : String(e.reps).split("-")[0];
      h += '<div class="set'+(s.done?' done':'')+'"><span class="sn">'+(j+1)+'</span><span class="pv">'+(p?fmtSet(e.id,p):'—')+'</span>' +
        '<input data-i="'+i+'" data-j="'+j+'" data-f="kg" inputmode="decimal" enterkeyhint="next" value="'+esc(s.kg)+'" placeholder="'+kgPh+'" aria-label="Charge série '+(j+1)+'">' +
        '<input data-i="'+i+'" data-j="'+j+'" data-f="reps" inputmode="numeric" enterkeyhint="done" value="'+esc(s.reps)+'" placeholder="'+repPh+'" aria-label="Répétitions série '+(j+1)+'">' +
        '<button class="chk" data-act="chk" data-i="'+i+'" data-j="'+j+'" aria-label="Valider la série '+(j+1)+'">'+IC.check+'</button></div>';
    });
    h += '</div><div class="set-act"><button class="btn sm" data-act="addset" data-i="'+i+'">+ Ajouter une série</button>'+(e.sets.length>1?'<button class="btn sm" data-act="rmset" data-i="'+i+'">Retirer la dernière</button>':'')+'</div></div>';
  });
  const c = cardioFor(inf.ckey, inf.phase, inf.deload, coachFor(DRAFT.date).flags);
  if (c.dur > 0) h += '<section class="card"><button class="toggle'+(DRAFT.cardio?' on':'')+'" data-act="wocardio"><span class="box">'+IC.check+'</span><span><b>'+c.name+' · '+c.dur+' min</b><br><span class="faint" style="font-size:13px">'+c.when+'</span></span></button></section>';
  h += '<section class="card"><h3>Notes</h3><textarea class="field" id="woNote" placeholder="Sensations, douleurs, réglages de machine…">'+esc(DRAFT.note||"")+'</textarea></section>';
  h += '<button class="btn ghost block danger" data-act="discard">'+(DRAFT.edit?'Annuler les modifications':'Abandonner la séance')+'</button>';
  h += '</div></div>';
  h += '<div class="restbar" id="restBar" hidden><div class="prog" id="restProg"></div><div class="in"><div class="tm"><small id="restLbl">Repos</small><span id="restTm">0:00</span><small id="restNext" style="letter-spacing:0;text-transform:none;font-weight:500;opacity:.8"></small></div><button class="btn" data-act="rest" data-n="-15">−15</button><button class="btn" data-act="rest" data-n="15">+15</button><button class="btn" data-act="rest" data-n="skip">Passer</button></div></div>';
  if (UI.confirm){
    const n = doneSets;
    if (UI.confirm === "finish") h += '<div class="confirm"><div class="in">' + (n ? '<h3>Enregistrer la séance ?</h3><p class="muted">'+n+' série'+(n>1?'s':'')+' validée'+(n>1?'s':'')+(allSets>n?', '+(allSets-n)+' non faite'+(allSets-n>1?'s':''):'')+'.</p><label for="woRpe" class="between" style="font-weight:600;font-size:14px">Effort ressenti (RPE) <span class="num" id="rpeVal" style="font-size:22px">'+(UI.rpe||7)+'</span></label><input id="woRpe" type="range" min="1" max="10" step="1" value="'+(UI.rpe||7)+'"><p class="faint" id="rpeTip" style="font-size:12.5px">'+rpeTip(UI.rpe||7)+'</p><div class="row"><button class="btn" data-act="cancelc">Continuer</button><button class="btn pri" data-act="save">Enregistrer</button></div>' : '<h3>Aucune série validée</h3><p class="muted">Valide tes séries avec ✓ pour les enregistrer.</p><div class="row"><button class="btn" data-act="cancelc">Continuer</button><button class="btn danger" data-act="dodiscard">Fermer sans enregistrer</button></div>') + '</div></div>';
    if (UI.confirm === "discard") h += '<div class="confirm"><div class="in"><h3>'+(DRAFT.edit?'Annuler les modifications ?':'Abandonner la séance ?')+'</h3><p class="muted">'+(DRAFT.edit?'La séance enregistrée reste telle quelle.':'Les séries saisies seront perdues.')+'</p><div class="row"><button class="btn" data-act="cancelc">Retour</button><button class="btn danger" data-act="dodiscard">'+(DRAFT.edit?'Annuler':'Abandonner')+'</button></div></div></div>';
  }
  el.innerHTML = h; el.hidden = false;
  const nb = el.querySelector(".wo-b"); if (nb) nb.scrollTop = top;
  tick();
}
function tick(){
  if (!DRAFT) return;
  const tm = $("#woTime");
  if (tm && !DRAFT.edit){ const s = Math.floor((Date.now()-DRAFT.startedAt)/1000); tm.textContent = (s>=3600?Math.floor(s/3600)+":"+String(Math.floor(s%3600/60)).padStart(2,"0"):Math.floor(s/60))+":"+String(s%60).padStart(2,"0"); }
  const bar = $("#restBar"); if (!bar) return;
  const left = Math.ceil((REST.end - Date.now())/1000);
  if (REST.end && left > -4){
    bar.hidden = false;
    $("#restLbl").textContent = left > 0 ? "Repos · "+fmtRest(REST.total)+" prévues" : "Fin du repos";
    $("#restTm").textContent = left > 0 ? fmtRest(left) : "C’est reparti !";
    $("#restNext").textContent = REST.next;
    $("#restProg").style.width = (left>0 ? (1 - left/REST.total)*100 : 100) + "%";
    if (left > 0 && left <= 3 && REST.lastTick !== left){ REST.lastTick = left; tone(660, 0.09, 0.18); }
    if (left <= 0 && !REST.beeped){ REST.beeped = true; beep(); }
  } else { bar.hidden = true; if (REST.end && left <= -4) REST.end = 0; }
}
setInterval(tick, 200);
function startRest(sec, next){ REST.end = Date.now()+sec*1000; REST.total = sec; REST.beeped = false; REST.lastTick = 0; REST.next = next || ""; tick(); }
function nextLabel(i, j){
  const e = DRAFT.ex[i], k = e.sets.findIndex((s,x) => x > j && !s.done);
  if (k >= 0) return "Ensuite : série "+(k+1)+" sur "+e.sets.length;
  for (let n = i+1; n < DRAFT.ex.length; n++) if (DRAFT.ex[n].sets.some(s => !s.done)) return "Ensuite : "+EX[DRAFT.ex[n].id].n;
  for (let n = 0; n < i; n++) if (DRAFT.ex[n].sets.some(s => !s.done)) return "Ensuite : "+EX[DRAFT.ex[n].id].n;
  return "Dernière série faite : appuie sur Terminer";
}

function finishWorkout(){
  const ex = DRAFT.ex.map(e => ({id:e.id, sets:e.sets.filter(s=>s.done).map(s => ({kg:isNaN(num(s.kg))?0:num(s.kg), reps:Math.round(num(s.reps))||0}))})).filter(e=>e.sets.length);
  const old = S.workouts[DRAFT.date];
  const rpe = UI.rpe || 7;
  const doc = {date:DRAFT.date, key:DRAFT.key, title:DRAFT.title, gym:true, startedAt:DRAFT.startedAt, dur: DRAFT.edit ? (DRAFT.dur||0) : Math.round((Date.now()-DRAFT.startedAt)/1000), ex, cardio:!!DRAFT.cardio, note:DRAFT.note||"", rpe};
  S.workouts[DRAFT.date] = doc; dbWrite("w_"+DRAFT.date, doc);
  const prs = wPRs(DRAFT.date);
  closeWO();
  toast(rpe >= 9 ? "Séance enregistrée. Plus dur que prévu : la prochaine fois, on garde les mêmes charges." : (prs ? "Séance enregistrée · "+prs+" record"+(prs>1?"s":"")+" battu"+(prs>1?"s":"")+" !" : "Séance enregistrée"));
}
const rpeTip = v => v <= 5 ? "Facile : tu aurais pu en faire beaucoup plus. Monte les charges." : v <= 8 ? "Dans la cible : dur mais contrôlé." : "Très dur : les charges ne monteront pas à la prochaine séance.";
function closeWO(){ DRAFT = null; saveDraft(); lsSet(LS_DRAFT, null); REST.end = 0; UI.confirm = null; unlockScreen(); renderWO(); renderMain(); }

/* ============ ÉVÉNEMENTS ============ */
let toastT = null;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(()=>{ t.hidden = true; }, 2600); }
function setTab(t){ UI.tab = t; if (location.hash.slice(1) !== t) { try { history.replaceState(null,"","#"+t); } catch(e) { location.hash = t; } } renderMain(); window.scrollTo(0,0); }

document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, d = b.dataset.d;
  switch(a){
    case "tab": setTab(b.dataset.t); break;
    case "sel": UI.sel = d; renderMain(); break;
    case "wk": UI.sel = ks(addDays(pd(UI.sel), 7*Number(b.dataset.n))); renderMain(); break;
    case "gotow": { const mon = pd(d), t = new Date(); UI.sel = (mondayOf(t).getTime()===mon.getTime()) ? todayKey() : d; setTab("aujourdhui"); break; }
    case "ci": UI.ci[b.dataset.k] = +b.dataset.v; b.parentNode.querySelectorAll("button").forEach(x => x.classList.toggle("on", x===b)); break;
    case "ciSave": S.checkins = Object.assign({}, S.checkins, {[todayKey()]: Object.assign({}, UI.ci)});
      { const ks0 = Object.keys(S.checkins).sort(); while (ks0.length > 60) delete S.checkins[ks0.shift()]; }
      dbWrite("checkins", {entries:S.checkins}); UI.ciEdit = false; UI.ci = null; renderMain(); toast("Check enregistré : "+READY[readinessFor(todayKey())][0]); break;
    case "ciEdit": UI.ciEdit = true; UI.ci = null; renderMain(); break;
    case "painNew": UI.pf = {zone:"cheville", side:"gauche", level:1, note:""}; UI.sheet = "@pain"; renderSheet(); break;
    case "pf": UI.pf[b.dataset.k] = b.dataset.k === "level" ? +b.dataset.v : b.dataset.v; renderSheet(); break;
    case "painSave": S.pains = S.pains.concat([{id:"p"+Date.now().toString(36), zone:UI.pf.zone, side:UI.pf.side, level:UI.pf.level, note:(UI.pf.note||"").slice(0,200), from:todayKey()}]);
      dbWrite("pains", {list:S.pains}); UI.sheet = null; renderSheet(); renderMain(); toast("Gêne notée : tes séances s’adaptent."); break;
    case "painOk": S.pains = S.pains.map(p => p.id === b.dataset.id ? Object.assign({}, p, {to:todayKey()}) : p);
      dbWrite("pains", {list:S.pains}); renderMain(); toast("Tant mieux ! Reprends progressivement."); break;
    case "runNew": UI.rf = {type:"run", min:"", km:"", dplus:"", rpe:4, date:UI.sel > todayKey() ? todayKey() : UI.sel}; UI.sheet = "@run"; renderSheet(); break;
    case "rf": UI.rf.type = b.dataset.v; renderSheet(); break;
    case "runSave": { const min = Math.round(num(UI.rf.min)); if (!(min > 0 && min < 1000)) { toast("Indique la durée en minutes"); break; }
      const date = UI.rf.date || todayKey(), km = num(UI.rf.km), dp = Math.round(num(UI.rf.dplus));
      S.runs = S.runs.concat([{id:"r"+Date.now().toString(36), date, type:UI.rf.type, min, km:isNaN(km)?0:Math.round(km*10)/10, dplus:isNaN(dp)?0:dp, rpe:UI.rf.rpe}]);
      if (S.runs.length > 400) S.runs = S.runs.slice(-400);
      dbWrite("runs", {list:S.runs});
      const w = Object.assign({date, key:info(pd(date)).key, gym:false, ex:[]}, S.workouts[date]||{}); if (!w.cardio) { w.cardio = true; S.workouts[date] = w; dbWrite("w_"+date, w); }
      UI.sheet = null; renderSheet(); renderMain(); toast("Sortie enregistrée"); break; }
    case "prot": { const items = proteinToday().concat([+b.dataset.i]); S.protein = {date:todayKey(), items}; dbWrite("protein", S.protein); renderMain(); break; }
    case "protRm": { const items = proteinToday().slice(); items.splice(+b.dataset.j, 1); S.protein = {date:todayKey(), items}; dbWrite("protein", S.protein); renderMain(); break; }
    case "quick": { const co = coachFor(d), old = S.workouts[d] || {};
      const doc = {date:d, key:co.key, title:co.sess.name, gym:true, quick:true, startedAt:Date.now(), dur:0, ex:[], cardio:!!old.cardio, note:old.note||""};
      S.workouts[d] = doc; dbWrite("w_"+d, doc); renderMain(); toast("Séance validée"); break; }
    case "startnow": S.settings = Object.assign({}, S.settings, {start:ks(mondayOf(new Date())), firstDay:todayKey()}); dbWrite("settings", S.settings); UI.sel = todayKey(); renderMain(); toast("C’est parti : première séance aujourd’hui !"); break;
    case "ex": UI.sheet = b.dataset.id; renderSheet(); break;
    case "closeSheet": UI.sheet = null; renderSheet(); break;
    case "start": startWorkout(d); break;
    case "resume": openWO(); break;
    case "edit": editWorkout(d); break;
    case "cardio": { const w = Object.assign({date:d, key:info(pd(d)).key, gym:false, ex:[]}, S.workouts[d]||{}); w.cardio = !w.cardio;
      if (!w.gym && !w.cardio){ delete S.workouts[d]; dbWrite("w_"+d, null); } else { S.workouts[d] = w; dbWrite("w_"+d, w); }
      renderMain(); if (w.cardio) toast("Cardio validé"); break; }
    case "chk": { const i = +b.dataset.i, j = +b.dataset.j, s = DRAFT.ex[i].sets[j];
      if (!s.done){ const row = b.closest(".set"), inK = row.querySelector('[data-f="kg"]'), inR = row.querySelector('[data-f="reps"]');
        if (!s.kg) s.kg = inK.placeholder || "0"; if (!s.reps) s.reps = inR.placeholder || "0";
        s.done = true; saveDraft(); ensureAudio(); renderWO();
        const nl = nextLabel(i, j); if (nl.indexOf("Dernière") === 0) { REST.end = 0; tick(); toast(nl); } else startRest(DRAFT.ex[i].rest, nl); }
      else { s.done = false; saveDraft(); renderWO(); }
      break; }
    case "addset": { const e = DRAFT.ex[+b.dataset.i], last = e.sets[e.sets.length-1]; e.sets.push({kg:last?last.kg:"", reps:"", done:false}); saveDraft(); renderWO(); break; }
    case "rmset": { const e = DRAFT.ex[+b.dataset.i]; if (e.sets.length>1) e.sets.pop(); saveDraft(); renderWO(); break; }
    case "wocardio": DRAFT.cardio = !DRAFT.cardio; saveDraft(); renderWO(); break;
    case "rest": if (b.dataset.n === "skip") { REST.end = 0; tick(); } else { REST.end += Number(b.dataset.n)*1000; REST.total = Math.max(REST.total + Number(b.dataset.n), 1); tick(); } break;
    case "finish": UI.confirm = "finish"; renderWO(); break;
    case "discard": UI.confirm = "discard"; renderWO(); break;
    case "cancelc": UI.confirm = null; renderWO(); break;
    case "save": finishWorkout(); break;
    case "dodiscard": closeWO(); break;
    case "libf": UI.libF = b.dataset.f; document.querySelectorAll(".filters .chip").forEach(c => c.classList.toggle("on", c.dataset.f===UI.libF)); renderLibList(); break;
    case "saveW": { const v = num($("#wIn").value); if (!(v>30 && v<150)) { toast("Entre ton poids en kg, par exemple 60,2"); break; }
      S.weights = Object.assign({}, S.weights, {[todayKey()]: Math.round(v*10)/10}); dbWrite("weights", {entries:S.weights}); renderMain(); toast("Poids enregistré : "+fmtKg(v)+" kg"); break; }
    case "sbCfg": { const url = ($("#sbUrl").value||"").trim().replace(/\/+$/,""), key = ($("#sbKey").value||"").trim();
      if (!/^https:\/\/.+\.supabase\.co$/.test(url) || key.length < 20) { toast("Vérifie l’URL (https://xxxx.supabase.co) et la clé anon"); break; }
      lsSet(SB_CFG, {url, key}); sb = null; renderMain(); syncNow(); break; }
    case "sbIn": sbAuth(false); break;
    case "sbUp": sbAuth(true); break;
    case "sbNow": syncNow(); break;
    case "sbOut": { const c = sbClient(); if (c) c.auth.signOut().finally(() => { UI.sbUser = null; SYNC = "signedout"; renderMain(); }); break; }
    case "sbReset": lsSet(SB_CFG, null); try { localStorage.removeItem(SB_AUTH); } catch(e) {} sb = null; UI.sbUser = null; SYNC = "off"; renderMain(); break;
    case "copySql": { const done = () => toast("Script copié"); try { navigator.clipboard.writeText(SETUP_SQL).then(done, () => { const r = document.createRange(); r.selectNodeContents($("#sqlText")); getSelection().removeAllRanges(); getSelection().addRange(r); toast("Sélectionné : copie-le manuellement"); }); } catch(e) { toast("Sélectionne le texte pour le copier"); } break; }
    case "saveSet": { const sv = $("#setStart").value, sw = num($("#setSW").value);
      if (!sv) { toast("Choisis une date de début"); break; }
      if (!(sw>30 && sw<150)) { toast("Poids de départ invalide"); break; }
      S.settings = Object.assign({}, S.settings, {start:ks(mondayOf(pd(sv))), startWeight:Math.round(sw*10)/10}); dbWrite("settings", S.settings); renderMain(); toast("Réglages enregistrés"); break; }
  }
});
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.matches("#wo input[data-f]") && DRAFT){ DRAFT.ex[+t.dataset.i].sets[+t.dataset.j][t.dataset.f] = t.value; saveDraft(); }
  else if (t.id === "woNote" && DRAFT){ DRAFT.note = t.value; saveDraft(); }
  else if (t.id === "libQ"){ UI.libQ = t.value; renderLibList(); }
  else if (t.id === "woRpe"){ UI.rpe = +t.value; $("#rpeVal").textContent = t.value; $("#rpeTip").textContent = rpeTip(+t.value); }
  else if (t.id === "pfNote" && UI.pf){ UI.pf.note = t.value; }
  else if (t.id === "rfRpe" && UI.rf){ UI.rf.rpe = +t.value; $("#rfRpeVal").textContent = t.value; }
  else if (t.id === "rfMin" && UI.rf){ UI.rf.min = t.value; }
  else if (t.id === "rfKm" && UI.rf){ UI.rf.km = t.value; }
  else if (t.id === "rfD" && UI.rf){ UI.rf.dplus = t.value; }
  else if (t.id === "rfDate" && UI.rf){ UI.rf.date = t.value; }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.classList.contains("tin")){ const v = num(t.value), id = t.dataset.t, w = t.dataset.w;
    const row = Object.assign({}, S.tests[id]||{}); if (isNaN(v)) delete row[w]; else row[w] = v;
    S.tests = Object.assign({}, S.tests, {[id]: row}); dbWrite("tests", {entries:S.tests}); toast(isNaN(v) ? "Résultat effacé" : "Résultat enregistré"); }
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && UI.sheet){ UI.sheet = null; renderSheet(); } });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && DRAFT) lockScreen(); });
window.addEventListener("hashchange", () => { const t = hashTab(); if (t !== UI.tab){ UI.tab = t; renderMain(); } });

UI.tab = hashTab();
renderMain();
if (DRAFT) renderWO();
window.addEventListener("DOMContentLoaded", syncNow);
window.addEventListener("online", syncNow);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") syncNow(); });
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
